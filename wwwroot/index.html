<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>棋盤對弈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css?v=3.0">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f3f5f8;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 600px);
      padding: clamp(20px, 5vw, 36px);
      border: 1px solid #e1e6ed;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 48px rgb(23 32 51 / 8%);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
    }

    .hint {
      margin: 0 0 22px;
      color: #647087;
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      margin-bottom: 20px;
    }

    .setting {
      display: grid;
      flex: 1 1 130px;
      gap: 6px;
      color: #465269;
      font-size: 0.9rem;
      font-weight: 600;
    }

    select,
    button {
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid #cbd3df;
      border-radius: 8px;
      background: #fff;
      color: #172033;
      font: inherit;
    }

    button {
      flex: 1 1 130px;
      border-color: #3157a4;
      background: #3157a4;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    select:disabled,
    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #board {
      width: 100%;
      margin: 0 auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #board div[class*="square-"],
    #board [data-square] {
      position: relative !important;
      overflow: visible !important;
    }

    #board .square-55d63.click-selected {
      background: #f6f669 !important;
    }

    #board .square-55d63.last-move-highlight {
      background-color: rgba(82, 179, 164, 0.6) !important;
    }

    #board [data-square].king-in-check {
      background: radial-gradient(
        ellipse at center,
        rgba(255, 0, 0, 0.85) 0%,
        rgba(231, 76, 60, 0.5) 50%,
        rgba(0, 0, 0, 0) 100%
      ) !important;
    }

    #board .checkmate-badge {
      position: absolute !important;
      width: 20px !important;
      height: 20px !important;
      border-radius: 50% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 11px !important;
      z-index: 10000 !important;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5) !important;
      pointer-events: none !important;
    }

    #board .checkmate-badge.defeated {
      top: -4px !important;
      right: -4px !important;
      background-color: #cc0000 !important;
      color: #ffffff !important;
    }

    #board .checkmate-badge.winner {
      bottom: -4px !important;
      right: -4px !important;
      background-color: #2ecc71 !important;
      color: #ffffff !important;
    }

    #board .legal-move-dot,
    #board .legal-move-capture {
      border-radius: 50% !important;
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      pointer-events: none !important;
      z-index: 99999 !important;
      display: block !important;
    }

    #board .legal-move-dot {
      width: 14px !important;
      height: 14px !important;
      background-color: rgba(0, 0, 0, 0.35) !important;
    }

    #board .legal-move-capture {
      width: 80% !important;
      height: 80% !important;
      border: 4px solid rgba(0, 0, 0, 0.35) !important;
      box-sizing: border-box !important;
    }

    .player-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 8px 2px;
    }

    .player-card + #board {
      margin-top: 6px;
    }

    #board + .player-card {
      margin-top: 6px;
    }

    .player-avatar {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      overflow: hidden;
      border-radius: 50%;
      background: #edf1f7;
    }

    .player-avatar img,
    .player-avatar svg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-details {
      min-width: 0;
      flex: 1;
    }

    .player-name {
      font-weight: 700;
      line-height: 1.3;
    }

    .captured-pieces {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      min-height: 20px;
      color: #647087;
      font-size: 1.05rem;
      letter-spacing: 1px;
      line-height: 1;
    }

    .captured-pieces:empty {
      min-height: 0;
    }

    .material-advantage {
      min-width: 30px;
      color: #697386;
      font-size: 0.9rem;
      font-weight: 700;
      text-align: right;
    }

    #status {
      min-height: 1.5em;
      margin: 18px 0 10px;
      font-weight: 600;
    }

    #status[data-error="true"] {
      color: #b42318;
    }

    details {
      margin-top: 12px;
      color: #647087;
      font-size: 0.9rem;
    }

    summary {
      cursor: pointer;
    }

    #fen {
      overflow-wrap: anywhere;
      margin: 8px 0 0;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .promotion-backdrop {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgb(15 23 42 / 58%);
    }

    .promotion-backdrop[hidden] {
      display: none;
    }

    .promotion-dialog {
      width: min(100%, 360px);
      padding: 24px;
      border: 1px solid #e1e6ed;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 70px rgb(15 23 42 / 25%);
      text-align: center;
    }

    .promotion-dialog h2 {
      margin: 0 0 6px;
      font-size: 1.25rem;
    }

    .promotion-dialog p {
      margin: 0 0 18px;
      color: #647087;
    }

    .promotion-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .promotion-choice {
      display: grid;
      justify-items: center;
      gap: 4px;
      min-height: 82px;
      padding: 8px 4px;
      border-color: #d7deea;
      background: #f7f9fc;
      color: #172033;
      cursor: pointer;
    }

    .promotion-choice:hover,
    .promotion-choice:focus-visible {
      border-color: #3157a4;
      background: #edf3ff;
    }

    .promotion-piece {
      font-size: 2rem;
      line-height: 1;
    }

    .promotion-cancel {
      margin-top: 12px;
      border-color: #cbd3df;
      background: #fff;
      color: #465269;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      main {
        padding: 18px;
      }
    }

    @media (max-width: 768px) {
      body {
        display: block;
        padding: 8px 0;
      }

      main {
        width: 100%;
        padding: 12px max(5vw, 12px);
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .hint {
        margin-bottom: 14px;
      }

      .settings {
        gap: 8px;
        margin-bottom: 12px;
      }

      #board {
        width: min(100%, 90vw);
      }

      .player-card {
        gap: 9px;
        min-height: 52px;
        padding: 5px 0;
      }

      #status {
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>棋盤對弈</h1>
    <p class="hint">你執白棋，拖曳棋子完成走步。</p>
    <div class="settings">
      <label class="setting" for="player-color">
        陣營
        <select id="player-color">
          <option value="white" selected>白棋</option>
          <option value="black">黑棋</option>
          <option value="random">隨機</option>
        </select>
      </label>
      <label class="setting" for="simulations">
        Simulations
        <select id="simulations">
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="400">400</option>
        </select>
      </label>
      <button id="new-game" type="button">開始新局</button>
    </div>
    <section class="player-card" aria-label="對手資訊">
      <div class="player-avatar">
        <img src="/assets/martin.png" alt="Martin 頭像">
      </div>
      <div class="player-details">
        <div class="player-name">Martin (250)</div>
        <div id="opponent-captured" class="captured-pieces" aria-label="對手吃掉的棋子"></div>
      </div>
      <div id="opponent-advantage" class="material-advantage" aria-label="對手子力優勢"></div>
    </section>
    <div id="board" aria-label="西洋棋棋盤"></div>
    <section class="player-card" aria-label="玩家資訊">
      <div class="player-avatar" aria-hidden="true">
        <svg viewBox="0 0 64 64" role="img">
          <circle cx="32" cy="32" r="32" fill="#e8edf5"/>
          <circle cx="32" cy="23" r="12" fill="#8b98ad"/>
          <path d="M10 58c2-13 10-20 22-20s20 7 22 20" fill="#8b98ad"/>
        </svg>
      </div>
      <div class="player-details">
        <div class="player-name">Player (67)</div>
        <div id="player-captured" class="captured-pieces" aria-label="玩家吃掉的棋子"></div>
      </div>
      <div id="player-advantage" class="material-advantage" aria-label="玩家子力優勢"></div>
    </section>
    <p id="status" role="status" aria-live="polite">輪到白棋</p>
    <details>
      <summary>目前局面 FEN</summary>
      <p id="fen"></p>
    </details>
  </main>

  <div id="promotion-modal" class="promotion-backdrop" hidden>
    <section class="promotion-dialog" role="dialog" aria-modal="true" aria-labelledby="promotion-title">
      <h2 id="promotion-title">選擇升變棋子</h2>
      <p>請選擇兵要升變的棋子。</p>
      <div class="promotion-options">
        <button class="promotion-choice" type="button" data-promotion="q"><span class="promotion-piece"></span><span>皇后</span></button>
        <button class="promotion-choice" type="button" data-promotion="r"><span class="promotion-piece"></span><span>城堡</span></button>
        <button class="promotion-choice" type="button" data-promotion="b"><span class="promotion-piece"></span><span>主教</span></button>
        <button class="promotion-choice" type="button" data-promotion="n"><span class="promotion-piece"></span><span>騎士</span></button>
      </div>
      <button id="promotion-cancel" class="promotion-cancel" type="button">取消</button>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js?v=3.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js?v=3.0"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js?v=3.0"></script>
  <script>
    const game = new Chess();
    const statusElement = document.getElementById("status");
    const fenElement = document.getElementById("fen");
    const playerColorSelect = document.getElementById("player-color");
    const simulationsSelect = document.getElementById("simulations");
    const newGameButton = document.getElementById("new-game");
    const promotionModal = document.getElementById("promotion-modal");
    const promotionCancelButton = document.getElementById("promotion-cancel");
    const promotionChoices = Array.from(
      promotionModal.querySelectorAll("[data-promotion]")
    );
    const capturedElements = {
      opponent: document.getElementById("opponent-captured"),
      player: document.getElementById("player-captured")
    };
    const advantageElements = {
      opponent: document.getElementById("opponent-advantage"),
      player: document.getElementById("player-advantage")
    };
    const initialPieceCounts = { p: 8, n: 2, b: 2, r: 2, q: 1 };
    const pieceValues = { p: 1, n: 3, b: 3, r: 5, q: 9 };
    const pieceSymbols = {
      w: { p: "♙", n: "♘", b: "♗", r: "♖", q: "♕" },
      b: { p: "♟", n: "♞", b: "♝", r: "♜", q: "♛" }
    };
    let promotionResolver = null;
    let waitingForEngine = false;
    let playerColor = "w";
    let selectedSquare = null;
    let selectedLegalMoves = [];
    let activeTouch = null;
    let ignoreClickUntil = 0;
    let lastMoveSquares = null;
    const boardElement = document.getElementById("board");

    const board = Chessboard("board", {
      position: "start",
      draggable: true,
      pieceTheme: "https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png",
      onDragStart: function (_source, piece) {
        return !waitingForEngine && game.turn() === playerColor &&
          piece.charAt(0) === playerColor && !game.game_over();
      },
      onDrop: onDrop,
      onSnapEnd: function () {
        board.position(game.fen());
        renderLastMoveHighlight();
      }
    });

    function clearSelection() {
      boardElement.querySelectorAll(
        ".click-selected, .legal-move-dot, .legal-move-capture"
      ).forEach((element) => {
        if (element.classList.contains("legal-move-dot") ||
            element.classList.contains("legal-move-capture")) {
          element.remove();
        } else {
          element.classList.remove("click-selected");
        }
      });
      selectedSquare = null;
      selectedLegalMoves = [];
    }

    function renderLastMoveHighlight() {
      boardElement.querySelectorAll(".last-move-highlight").forEach((square) => {
        square.classList.remove("last-move-highlight");
      });
      if (!lastMoveSquares) {
        return;
      }

      [lastMoveSquares.from, lastMoveSquares.to].forEach((square) => {
        const element = boardElement.querySelector(
          '[data-square="' + square + '"]'
        );
        if (element) {
          element.classList.add("last-move-highlight");
        }
      });
    }

    function setLastMove(from, to) {
      lastMoveSquares = { from: from, to: to };
      renderLastMoveHighlight();
    }

    function findKingSquare(color) {
      const position = game.board();
      for (let row = 0; row < position.length; row += 1) {
        for (let column = 0; column < position[row].length; column += 1) {
          const piece = position[row][column];
          if (piece && piece.type === "k" && piece.color === color) {
            return String.fromCharCode(97 + column) + (8 - row);
          }
        }
      }
      return null;
    }

    function appendCheckmateBadge(square, role) {
      const squareElement = boardElement.querySelector(
        '[data-square="' + square + '"]'
      );
      if (!squareElement) {
        return;
      }

      const badge = document.createElement("div");
      badge.className = "checkmate-badge " + role;
      badge.textContent = "👑";
      badge.setAttribute("aria-label", role === "defeated" ? "將殺" : "勝利");
      squareElement.appendChild(badge);
    }

    function renderCheckState() {
      boardElement.querySelectorAll(".king-in-check").forEach((square) => {
        square.classList.remove("king-in-check");
      });
      boardElement.querySelectorAll(".checkmate-badge").forEach((badge) => {
        badge.remove();
      });

      if (!game.in_check()) {
        return;
      }

      const defeatedColor = game.turn();
      const defeatedKingSquare = findKingSquare(defeatedColor);
      if (!defeatedKingSquare) {
        return;
      }

      const defeatedKing = boardElement.querySelector(
        '[data-square="' + defeatedKingSquare + '"]'
      );
      if (defeatedKing) {
        defeatedKing.classList.add("king-in-check");
      }

      if (game.in_checkmate()) {
        appendCheckmateBadge(defeatedKingSquare, "defeated");
        const winnerKingSquare = findKingSquare(
          defeatedColor === "w" ? "b" : "w"
        );
        if (winnerKingSquare) {
          appendCheckmateBadge(winnerKingSquare, "winner");
        }
      }
    }

    function selectSquare(square) {
      clearSelection();
      const piece = game.get(square);
      if (!piece || piece.color !== playerColor || game.turn() !== playerColor ||
          waitingForEngine || game.game_over()) {
        return;
      }

      selectedSquare = square;
      selectedLegalMoves = game.moves({ square: square, verbose: true });
      console.log("[Chess] Selected:", square, "Legal moves:", selectedLegalMoves);
      const selectedElement = boardElement.querySelector(
        '[data-square="' + square + '"]'
      );
      if (selectedElement) {
        selectedElement.classList.add("click-selected");
      }

      selectedLegalMoves.forEach((move) => {
        const target = boardElement.querySelector('[data-square="' + move.to + '"]');
        if (!target) {
          console.warn("[Chess] Target square DOM not found:", move.to);
          return;
        }
        const isCapture =
          Boolean(move.captured) ||
          move.flags.includes("e");
        const indicator = document.createElement("div");
        indicator.className = isCapture
          ? "legal-move-capture"
          : "legal-move-dot";
        indicator.setAttribute("aria-hidden", "true");
        target.style.position = "relative";
        target.style.overflow = "visible";
        target.appendChild(indicator);
        console.log("[Chess] Appended dot to square:", move.to);
      });
    }

    function squareFromElement(element) {
      if (!element) {
        return null;
      }
      const dataSquare = element.getAttribute("data-square");
      if (dataSquare && /^[a-h][1-8]$/.test(dataSquare)) {
        return dataSquare;
      }

      const squareClass = Array.from(element.classList).find((className) =>
        /^square-[a-h][1-8]$/.test(className)
      );
      return squareClass ? squareClass.substring(7) : null;
    }

    function isPromotionMove(source, target) {
      const piece = game.get(source);
      return Boolean(
        piece &&
        piece.type === "p" &&
        ((piece.color === "w" && target.charAt(1) === "8") ||
          (piece.color === "b" && target.charAt(1) === "1")) &&
        game.moves({ square: source, verbose: true }).some((move) =>
          move.to === target && Boolean(move.promotion)
        )
      );
    }

    function completePlayerMove(source, target, promotion) {
      const previousFen = game.fen();
      const previousLastMove = lastMoveSquares;
      const move = game.move({
        from: source,
        to: target,
        promotion: promotion || "q"
      });
      if (!move) {
        clearSelection();
        board.position(game.fen());
        return;
      }

      clearSelection();
      board.position(game.fen());
      setLastMove(move.from, move.to);
      renderCheckState();
      fenElement.textContent = game.fen();
      renderPlayerInfo();
      if (game.game_over()) {
        finishGame();
      } else {
        requestEngineMove(previousFen, previousLastMove);
      }
    }

    function attemptSelectedMove(target) {
      const matchingMove = selectedLegalMoves.find((move) => move.to === target);
      if (!matchingMove || !selectedSquare) {
        return false;
      }

      const source = selectedSquare;
      clearSelection();
      if (matchingMove.promotion) {
        showPromotionPicker(playerColor).then((promotion) => {
          if (promotion && !waitingForEngine) {
            completePlayerMove(source, target, promotion);
          }
        });
      } else {
        completePlayerMove(source, target);
      }
      return true;
    }

    boardElement.addEventListener(
      "touchmove",
      (event) => {
        event.preventDefault();
        if (activeTouch && event.touches.length) {
          const touch = event.touches[0];
          if (Math.hypot(
            touch.clientX - activeTouch.startX,
            touch.clientY - activeTouch.startY
          ) > 8) {
            activeTouch.moved = true;
          }
        }
      },
      { passive: false }
    );
    boardElement.addEventListener("click", (event) => {
      if (Date.now() < ignoreClickUntil) {
        event.preventDefault();
        return;
      }
      const squareElement = event.target.closest(".square-55d63");
      if (!squareElement) {
        clearSelection();
        return;
      }
      handleBoardSelection(event, squareElement);
    });

    boardElement.addEventListener("touchstart", (event) => {
      const squareElement = event.target.closest(".square-55d63");
      if (!squareElement) {
        activeTouch = null;
        clearSelection();
        return;
      }
      if (event.touches.length !== 1) {
        activeTouch = null;
        return;
      }
      const touch = event.touches[0];
      activeTouch = {
        square: squareFromElement(squareElement),
        startX: touch.clientX,
        startY: touch.clientY,
        moved: false
      };
    }, { passive: true });

    boardElement.addEventListener("touchend", (event) => {
      if (!activeTouch) {
        return;
      }
      const touch = activeTouch;
      activeTouch = null;
      if (touch.moved) {
        ignoreClickUntil = Date.now() + 500;
        return;
      }

      const squareElement = event.target.closest(".square-55d63");
      if (squareElement && touch.square === squareFromElement(squareElement)) {
        ignoreClickUntil = Date.now() + 500;
        handleBoardSelection(event, squareElement);
      }
    }, { passive: true });

    boardElement.addEventListener("touchcancel", () => {
      activeTouch = null;
    }, { passive: true });

    function handleBoardSelection(event, squareElement) {
      if (waitingForEngine || promotionResolver) {
        return;
      }

      const square = squareFromElement(squareElement);
      if (!square) {
        clearSelection();
        return;
      }

      if (selectedSquare === square) {
        clearSelection();
        return;
      }
      if (attemptSelectedMove(square)) {
        return;
      }

      const piece = game.get(square);
      if (piece && piece.color === playerColor && game.turn() === playerColor) {
        selectSquare(square);
      } else {
        clearSelection();
      }
    }

    function setStatus(message, isError) {
      statusElement.textContent = message;
      statusElement.dataset.error = String(Boolean(isError));
    }

    function setControlsDisabled(disabled) {
      playerColorSelect.disabled = disabled;
      simulationsSelect.disabled = disabled;
      newGameButton.disabled = disabled;
    }

    function renderPlayerInfo() {
      const counts = { w: {}, b: {} };
      for (const color of ["w", "b"]) {
        for (const type of Object.keys(pieceValues)) {
          counts[color][type] = 0;
        }
      }

      for (const row of game.board()) {
        for (const piece of row) {
          if (piece) {
            counts[piece.color][piece.type] += 1;
          }
        }
      }

      const capturedBy = (capturer, capturedColor) => {
        const symbols = [];
        for (const type of ["q", "r", "b", "n", "p"]) {
          const missing = Math.max(
            0,
            initialPieceCounts[type] - counts[capturedColor][type]
          );
          for (let index = 0; index < missing; index += 1) {
            symbols.push(pieceSymbols[capturedColor][type]);
          }
        }
        capturedElements[capturer].textContent = symbols.join(" ");
        capturedElements[capturer].setAttribute(
          "aria-label",
          symbols.length
            ? "吃掉的棋子：" + symbols.join(" ")
            : "尚未吃掉棋子"
        );
      };

      capturedBy("player", playerColor === "w" ? "b" : "w");
      capturedBy("opponent", playerColor === "w" ? "w" : "b");

      let whiteMaterial = 0;
      let blackMaterial = 0;
      for (const color of ["w", "b"]) {
        for (const [type, value] of Object.entries(pieceValues)) {
          const material = counts[color][type] * value;
          if (color === "w") {
            whiteMaterial += material;
          } else {
            blackMaterial += material;
          }
        }
      }
      const difference = whiteMaterial - blackMaterial;
      const advantageFor = (color) => {
        const advantage = color === "w" ? difference : -difference;
        return advantage > 0 ? "+" + advantage : "";
      };
      const opponentColor = playerColor === "w" ? "b" : "w";
      advantageElements.player.textContent = advantageFor(playerColor);
      advantageElements.opponent.textContent = advantageFor(opponentColor);
    }

    function sideName(color) {
      return color === "w" ? "白棋" : "黑棋";
    }

    function showPromotionPicker(color) {
      const symbols = pieceSymbols[color];
      promotionChoices.forEach((choice) => {
        choice.querySelector(".promotion-piece").textContent =
          symbols[choice.dataset.promotion];
      });
      promotionModal.hidden = false;
      promotionChoices[0].focus();
      return new Promise((resolve) => {
        promotionResolver = resolve;
      });
    }

    function closePromotionPicker(promotion) {
      if (!promotionResolver) {
        return;
      }
      const resolve = promotionResolver;
      promotionResolver = null;
      promotionModal.hidden = true;
      resolve(promotion);
    }

    function finishGame() {
      if (game.in_checkmate()) {
        setStatus(game.turn() === "w" ? "將死，黑棋獲勝。" : "將死，白棋獲勝。");
      } else if (game.in_draw()) {
        setStatus("和局。");
      } else {
        setStatus("對局結束。");
      }
    }

    function applyEngineMove(bestMove) {
      if (typeof bestMove !== "string" || bestMove.trim() === "") {
        console.error("無法套用後端走步。", {
          fen: game.fen(),
          bestMove: bestMove
        });
        throw new Error("後端未提供有效的 bestMove。");
      }

      const moveText = bestMove.trim();
      const uciMove = {
        from: moveText.substring(0, 2),
        to: moveText.substring(2, 4),
        promotion: moveText.length > 4 ? moveText.substring(4, 5) : "q"
      };
      const expectedColor = game.turn();
      let move;

      try {
        move = game.move(uciMove);
      } catch (error) {
        console.error("無法套用後端走步。", {
          fen: game.fen(),
          bestMove: bestMove
        });
        throw error;
      }

      if (!move || move.color !== expectedColor) {
        console.error("無法套用後端走步。", {
          fen: game.fen(),
          bestMove: bestMove
        });
        throw new Error("後端回傳的 bestMove 無效。");
      }
      return move;
    }

    async function requestEngineMove(previousFen, previousLastMove) {
      waitingForEngine = true;
      setControlsDisabled(true);
      setStatus("引擎思考中…");
      fenElement.textContent = game.fen();

      try {
        const response = await fetch("/api/move", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            fen: game.fen(),
            simulations: parseInt(simulationsSelect.value, 10)
          })
        });

        if (!response.ok) {
          throw new Error("伺服器回應錯誤（HTTP " + response.status + "）。");
        }

        const result = await response.json();
        const engineMove = applyEngineMove(result.bestMove);
        board.position(game.fen());
        setLastMove(engineMove.from, engineMove.to);
        renderCheckState();
        fenElement.textContent = game.fen();
        renderPlayerInfo();

        if (game.game_over()) {
          finishGame();
        } else {
          setStatus("輪到" + sideName(playerColor));
        }
      } catch (error) {
        game.load(previousFen);
        board.position(previousFen);
        lastMoveSquares = previousLastMove || null;
        renderLastMoveHighlight();
        renderCheckState();
        fenElement.textContent = previousFen;
        renderPlayerInfo();
        setStatus("走步未完成：" + error.message + " 請再試一次。", true);
      } finally {
        waitingForEngine = false;
        setControlsDisabled(false);
      }
    }

    function onDrop(source, target) {
      if (waitingForEngine) {
        return "snapback";
      }

      clearSelection();

      if (isPromotionMove(source, target)) {
        showPromotionPicker(playerColor).then((promotion) => {
          if (promotion && !waitingForEngine) {
            completePlayerMove(source, target, promotion);
          } else {
            board.position(game.fen());
            renderLastMoveHighlight();
          }
        });
        return "snapback";
      }

      if (!game.moves({ square: source, verbose: true }).some((move) =>
        move.to === target
      )) {
        clearSelection();
        return "snapback";
      }

      completePlayerMove(source, target);
    }

    function startNewGame() {
      if (waitingForEngine) {
        return;
      }

      const selectedColor = playerColorSelect.value;
      playerColor = selectedColor === "random"
        ? (Math.random() < 0.5 ? "w" : "b")
        : selectedColor === "black" ? "b" : "w";

      game.reset();
      clearSelection();
      lastMoveSquares = null;
      board.position(game.fen());
      renderLastMoveHighlight();
      renderCheckState();
      board.orientation(playerColor === "b" ? "black" : "white");
      fenElement.textContent = game.fen();
      renderPlayerInfo();
      setStatus("你執" + sideName(playerColor));
      document.querySelector(".hint").textContent =
        "你執" + sideName(playerColor) + "，拖曳棋子完成走步。";

      if (playerColor === "b") {
        requestEngineMove(game.fen());
      }
    }

    playerColorSelect.addEventListener("change", startNewGame);
    newGameButton.addEventListener("click", startNewGame);
    promotionChoices.forEach((choice) => {
      choice.addEventListener("click", () => {
        closePromotionPicker(choice.dataset.promotion);
      });
    });
    promotionCancelButton.addEventListener("click", () => closePromotionPicker(null));
    promotionModal.addEventListener("click", (event) => {
      if (event.target === promotionModal) {
        closePromotionPicker(null);
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !promotionModal.hidden) {
        closePromotionPicker(null);
      }
    });
    startNewGame();
    window.addEventListener("resize", board.resize);
  </script>
</body>
</html>
